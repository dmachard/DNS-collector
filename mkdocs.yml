site_name: DNS-collector
site_description: Capture DNS traffic, process it intelligently, and stream it downstream
site_author: dmachard
site_url: https://dmachard.github.io/DNS-collector/
repo_name: dmachard/DNS-collector
repo_url: https://github.com/dmachard/DNS-collector

theme:
  name: material
  logo: dns-collector_logo.png
  font:
    text: Outfit
    code: JetBrains Mono
  palette:
    # Light mode (default)
    - scheme: default
      primary: slate
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: slate
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

watch:
  - docs

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

