global:
  trace:
    verbose: true

pipelines:
  - name: tap
    dnstap:
      listen-ip: 0.0.0.0
      listen-port: 6000
    transforms:
      normalize:
        qname-lowercase: true
        qname-replace-nonprintable: true
    routing-policy:
      forward: [ stdout-json, prom, loki ]
      dropped: [ ]

  - name: stdout-json
    stdout:
      mode: flat-json

  - name: prom
    prometheus:
      listen-ip: 0.0.0.0
      listen-port: 8080

  - name: loki
    lokiclient:
      server-url: http://loki:3100/loki/api/v1/push
      job-name: dnscollector
      mode: flat-json
      flush-interval: 5
