################################################
# global configuration
#  more details: https://github.com/dmachard/DNS-collector/blob/main/docs/configuration.md#global
################################################
global:
  trace:
    verbose: true
    log-malformed: true
    filename: ""
    max-size: 10
    max-backups: 10
  server-identity: "dns-collector"
  pid-file: ""
  text-format: "timestamp-rfc3339ns identity operation rcode queryip queryport family protocol length-unit qname qtype latency"
  text-format-delimiter: " "
  text-format-boundary: "\""
  text-jinja: ""
  worker:
    interval-monitor: 10
    buffer-size: 512
    batch-size: 64
    flush-interval-ms: 10
  telemetry:
    enabled: false
    web-path: "/metrics"
    web-listen: ":9165"
    sock-path: ""
    sock-mode: "0660"
    prometheus-prefix: "dnscollector_exporter"
    tls-support: false
    tls-cert-file: ""
    tls-key-file: ""
    client-ca-file: ""
    basic-auth-enable: false
    basic-auth-login: "admin"
    basic-auth-pwd: "changeme"
  framestream:
    control-frame-max-length: 4064
    data-frame-max-length: 1048576
    handshake-timeout: 5
    content-type: "protobuf:dnstap.Dnstap"
  transformers-order: 
    - "extract"
    - "normalize"
    - "filtering"
    - "geoip"
    - "bgp"
    - "atags"
    - "suspicious"
    - "user-privacy"
    - "machine-learning"
    - "rest"
    - "relabeling"
    - "latency"
    - "rewrite"
    - "new-domain-tracker"
    - "unique-response-tracker"
    - "reducer"
    - "reordering"

################################################
# Pipelining configuration
#   more details: https://github.com/dmachard/DNS-collector/blob/main/docs/pipelines.md
#   components: https://github.com/dmachard/DNS-collector/blob/main/docs/components.md
#   transformers: https://github.com/dmachard/DNS-collector/blob/main/docs/transformers.md
################################################
pipelines:
  - name: tap
    dnstap:
      listen-ip: 0.0.0.0
      listen-port: 6000
    transforms:
      normalize:
        qname-lowercase: true
        qname-replace-nonprintable: true
    routing-policy:
      forward: [ console ]
      dropped: [ ]

  - name: console
    stdout:
      mode: text
