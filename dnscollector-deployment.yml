apiVersion: v1
kind: ConfigMap
metadata:
  name: dnscollector-config
  labels:
    app: dnscollector
data:
  config.yml: |
    global:
      trace:
        verbose: true

    multiplexer:
      collectors:
        - name: tap
          dnstap:
            listen-ip: 0.0.0.0
            listen-port: 6000
          transforms:
            normalize:
              qname-lowercase: true
      loggers:
        - name: console
          stdout:
            mode: text
        - name: prom
          prometheus:
            listen-ip: 0.0.0.0
            listen-port: 8080
      routes:
        - from: [ tap ]
          to: [ console, prom ]
---
apiVersion: v1
kind: Service
metadata:
  name: dnscollector-service
  labels:
    app: dnscollector
spec:
  type: ClusterIP
  selector:
    app: dnscollector
  ports:
  - name: dnstap
    protocol: TCP
    port: 6000
    targetPort: 6000
  - name: prometheus
    protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscollector-deployment
  labels:
    app: dnscollector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnscollector
  template:
    metadata:
      labels:
        app: dnscollector
    spec:
      containers:
      - name: dnscollector
        image: dmachard/dnscollector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: dnstap
          containerPort: 6000
          protocol: TCP
        - name: prometheus
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/dnscollector/config.yml
          subPath: config.yml
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 6000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: dnscollector-config
