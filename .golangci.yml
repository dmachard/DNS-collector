version: "2"
linters:
  default: none
  enable:
    - errorlint
    - goconst
    - gocritic
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
  settings:
    goconst:
      min-len: 10
      min-occurrences: 10
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
