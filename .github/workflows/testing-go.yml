name: Go Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
    branches:
      - main

permissions:
  contents: read

env:
  PROM_VERSION: "3.13.0"
  GENTAP: "1.1.2"
  PYTHON_VERSION: '3.14'
  GO_VERSION: '1.26'

jobs:
  build_bin:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Build Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dnscollector *.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dnscollector
          path: dnscollector

  testunit:
    strategy:
      matrix:
        os-version: [ 'ubuntu-26.04' ]
        go-version: [ '1.26' ] 
        package:
          - '.'
          - 'pkgconfig'
          - 'pkginit'
          - 'dnsutils'
          - 'workers'
          - 'transformers'
          - 'telemetry'
    
    runs-on: "${{ matrix.os-version }}"

    steps:
    - uses: actions/checkout@v7

    - name: Configure environment to avoid toolchain installs 
      shell: bash
      run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Show Go version
      run: |
        go version

    - name: Test ${{ matrix.package }}
      run: go test -timeout 240s -exec sudo ./${{ matrix.package }}/ -race -cover -v
      
  fuzzing:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: "${{ env.GO_VERSION }}"
    - name: Fuzzing
      run: go test -timeout 60s -fuzz=FuzzDecodeDNS -fuzztime=10s ./dnsutils

  config:
    needs: build_bin
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
  
    - name: Download Binary Artifact
      uses: actions/download-artifact@v8
      with:
        name: dnscollector

    - name: Make Binary Executable
      run: chmod +x dnscollector

    - uses: actions/setup-python@v7
      with:
        python-version: "${{ env.PYTHON_VERSION }}"

    - name: Test config
      run: |
        python3 -m unittest tests.config -v

  metrics:
    needs: build_bin
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Download Binary Artifact
      uses: actions/download-artifact@v8
      with:
        name: dnscollector

    - name: Make Binary Executable
      run: chmod +x dnscollector

    - name: run collector
      run: ./dnscollector -config ./tests/testsdata/config_prom.yml &

    - name: download dnstap generator
      run: |
        wget -nv https://github.com/dmachard/dnstap-generator/releases/download/v${{ env.GENTAP }}/dnstap-generator_${{ env.GENTAP }}_linux_amd64.tar.gz
        tar xf dnstap-generator_${{ env.GENTAP }}_linux_amd64.tar.gz
        ./dnstap-generator -i 127.0.0.1 -p 6000 -n 1

    - name: check prometheus format metrics
      run: |
        wget -nv https://github.com/prometheus/prometheus/releases/download/v$PROM_VERSION/prometheus-$PROM_VERSION.linux-amd64.tar.gz
        tar xf prometheus-$PROM_VERSION.linux-amd64.tar.gz
        cd prometheus-$PROM_VERSION.linux-amd64/
        curl -u admin:changeme http://127.0.0.1:8081/metrics | ./promtool check metrics

  count:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure environment to avoid toolchain installs 
      shell: bash
      run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Count tests, benchmarks and fuzzers
      run: |
        TESTS_COUNT=$(go test -list '.*' ./... | grep -E '^(Test|Benchmark|Fuzz)' | sort -u | wc -l)
        TEST_UNIT_COUNT=$(go test -list '.*' ./... | grep -E '^Test' | sort -u | wc -l)
        BENCH_COUNT=$(go test -list '.*' ./... | grep -E '^Benchmark' | sort -u | wc -l)
        FUZZ_COUNT=$(go test -list '.*' ./... | grep -E '^Fuzz' | sort -u | wc -l)
        echo "Total tests & benchmarks : $TESTS_COUNT"
        echo "Unit tests               : $TEST_UNIT_COUNT"
        echo "Benchmarks               : $BENCH_COUNT"
        echo "Fuzzers                  : $FUZZ_COUNT"

    - name: Count lines of code
      run: |
        make stats
