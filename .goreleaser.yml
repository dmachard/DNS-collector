version: 2

before:
  hooks:
    - go mod tidy

builds:
- env:
    - CGO_ENABLED=0

  flags:
    - -trimpath

  ldflags:
    - -s -w
    - -X github.com/prometheus/common/version.Version={{.Version}}
    - -X github.com/prometheus/common/version.Revision={{.Commit}}
    - -X github.com/prometheus/common/version.Branch={{.Branch}}
    - -X github.com/prometheus/common/version.BuildDate={{.Date}}

  goos:
    - windows
    - linux
    - darwin
    - freebsd
  goarch:
    - amd64
    - arm64

  # Build reproducible
  mod_timestamp: '{{ .CommitTimestamp }}'

  # Binary name.
  binary: dnscollector

archives:
- id: zipformat
  formats: [ 'zip' ]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  files:
    - config.yml
    
- id: targzformat
  formats: [ 'tar.gz' ]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  files:
    - config.yml

upx:
  - enabled: true
    compress: best
    lzma: true
    goos:
      - linux
      - darwin
      - freebsd

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
