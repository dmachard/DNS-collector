global:
  trace:
    verbose: true

pipelines:
  - name: tap
    dnstap:
      listen-ip: 0.0.0.0
      listen-port: 6000
    transforms:
      normalize:
        qname-lowercase: true
        qname-replace-nonprintable: true
    routing-policy:
      forward: [ stdout-json, prom ]
      dropped: [ ]

  - name: stdout-json
    stdout:
      mode: flat-json

  - name: prom
    prometheus:
      listen-ip: 0.0.0.0
      listen-port: 8080
